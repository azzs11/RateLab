# Three server nodes sharing one Redis, plus the load generator.
#
#   just cluster        # run it and write results/cluster.json
#
# Or by hand from the repo root:
#   docker compose -f deploy/docker-compose.yml up --build \
#     --abort-on-container-exit --exit-code-from loadgen
#
# node1 is also published on http://localhost:3001 for trying the dashboard.

name: drl

x-settings: &settings
  DRL_BACKEND: redis
  DRL_REDIS_URL: redis://redis:6379/
  DRL_LIMIT: "50"
  DRL_WINDOW_MS: "1000"
  DRL_REDIS_TIMEOUT_MS: "100"
  DRL_BREAKER_FAILURES: "5"
  DRL_BREAKER_OPEN_MS: "1000"
  RUST_LOG: warn

x-node: &node
  image: drl:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30

  node1:
    <<: *node
    environment:
      <<: *settings
      DRL_NODE_ID: node1
    ports:
      - "3001:3001"

  node2:
    <<: *node
    environment:
      <<: *settings
      DRL_NODE_ID: node2

  node3:
    <<: *node
    environment:
      <<: *settings
      DRL_NODE_ID: node3

  loadgen:
    image: drl:local
    command: ["loadgen"]
    user: root
    depends_on:
      redis:
        condition: service_healthy
      node1:
        condition: service_started
      node2:
        condition: service_started
      node3:
        condition: service_started
    environment:
      <<: *settings
      DRL_TARGETS: http://node1:3001,http://node2:3001,http://node3:3001
      DRL_OUT: /results/cluster.json
      DRL_QUICK: ${DRL_QUICK:-false}
      DRL_HOST: ${DRL_HOST:-}
      DRL_GIT_COMMIT: ${DRL_GIT_COMMIT:-}
    volumes:
      - ../results:/results
