name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --locked --workspace --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --locked --workspace

    - name: No sleeps in library or test code
      run: |
        if grep -rn "sleep(" crates/core crates/sim crates/wasm crates/redis-store crates/bench/benches; then
          echo "Tests must use the mock clock (drl_core::ManualClock), not sleep." >&2
          exit 1
        fi

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust 1.89
      uses: dtolnay/rust-toolchain@1.89

    - uses: Swatinem/rust-cache@v2

    - name: Test on the minimum supported Rust version
      run: cargo test --locked --workspace

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: clippy

    - uses: Swatinem/rust-cache@v2

    - name: Clippy for wasm32
      run: cargo clippy --locked -p wasm --target wasm32-unknown-unknown -- -D warnings

    - name: Build for wasm32
      run: cargo build --locked -p wasm --target wasm32-unknown-unknown --release

  redis:
    name: Redis integration (testcontainers)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    # The tests start their own Redis container through the runner's Docker.
    - name: Run tests that need Docker
      run: cargo test --locked --workspace -- --ignored

  bench-smoke:
    name: Bench pipeline (quick sizes)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    # Same steps as `just smoke`: checks the suite, memory and report run end to end.
    # Quick sizes on a shared runner, so the numbers are not kept.
    - name: In-process suite, memory and report
      run: |
        mkdir -p target/smoke
        cargo run --locked -p bench --release -- local --quick --out target/smoke/local.json
        cargo run --locked -p bench --release --bin memory -- --quick --out target/smoke/memory.json
        cargo run --locked -p bench --release -- strategies --quick --out target/smoke/strategies.json
        printf '<!-- results:start (generated by `just results`, do not edit) -->\n<!-- results:end -->\n' > target/smoke/README.md
        cargo run --locked -p bench --release -- report --dir target/smoke --readme target/smoke/README.md
        grep -q "Accuracy against the exact oracle" target/smoke/RESULTS.md
        grep -q "Where adaptive leasing loses" target/smoke/RESULTS.md
        test -s target/smoke/pareto-3-nodes.svg

  cluster-smoke:
    name: 3-node Docker Compose run (quick)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Build the image and run 3 nodes + Redis + load generator
      env:
        DRL_QUICK: "true"
        DRL_GIT_COMMIT: ${{ github.sha }}
      run: |
        mkdir -p results
        docker compose -f deploy/docker-compose.yml up --build --abort-on-container-exit --exit-code-from loadgen

    - name: Check the results file
      run: |
        test -s results/cluster.json
        grep -q '"nodes": 3' results/cluster.json

    - name: Every strategy on the real cluster against the simulator (quick)
      env:
        DRL_QUICK: "true"
        DRL_GIT_COMMIT: ${{ github.sha }}
      run: |
        docker compose -f deploy/docker-compose.yml down --remove-orphans
        docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.strategies.yml up --build --abort-on-container-exit --exit-code-from loadgen
        test -s results/real_strategies.json

    - name: Stop the cluster
      if: always()
      run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.strategies.yml down --rmi all --volumes --remove-orphans

  web:
    name: Playground (typecheck, unit, end-to-end, accessibility)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust with the wasm32 target
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - uses: Swatinem/rust-cache@v2

    - name: Install wasm-bindgen (same version as the crate)
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen-cli@0.2.130

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Build
      working-directory: web
      run: |
        npm ci
        npm run build

    - name: Log parser unit tests
      working-directory: web
      run: node --test tests/logs.test.ts

    - name: End-to-end and accessibility tests (Playwright + axe)
      working-directory: web
      run: |
        npx playwright install --with-deps chromium
        npm run test:e2e
