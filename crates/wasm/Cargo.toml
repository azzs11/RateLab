[package]
name = "wasm"
description = "WebAssembly bindings for ratelab, for the browser playground."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# wasm32-unknown-unknown has no system clock: time is passed in from JavaScript.
ratelab.workspace = true
sim = { path = "../sim" }
wasm-bindgen = "0.2.130"

[lints]
workspace = true
