[package]
name = "drl-redis-store"
description = "Redis-backed token bucket for ratelab: EVALSHA, Redis TIME, circuit breaker."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ratelab.workspace = true
thiserror.workspace = true
redis = { version = "1.8", default-features = false, features = ["script", "tokio-comp", "connection-manager"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
testcontainers-modules = { version = "0.15", features = ["redis"] }

[lints]
workspace = true
