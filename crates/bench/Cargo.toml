[package]
name = "bench"
description = "Benchmarks, exact oracle and measurement scenarios for the rate limiter."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
default-run = "bench"

[dependencies]
ratelab = { workspace = true, features = ["std-clock"] }
sim = { path = "../sim" }
server = { path = "../server" }
anyhow = "1.0"
axum = { version = "0.8", default-features = false }
cap = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
redis = { version = "1.8", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["test-util"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false

[lints]
workspace = true
