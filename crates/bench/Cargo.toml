[package]
name = "bench"
description = "Benchmarks, exact oracle and measurement scenarios for the rate limiter."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
default-run = "bench"

[dependencies]
drl-core = { workspace = true, features = ["std-clock"] }
sim = { path = "../sim" }
anyhow = "1.0"
cap = "0.1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false

[lints]
workspace = true
