[package]
name = "ratelab-cli"
description = "The ratelab command: simulate rate limiters, replay access logs to choose a limit, benchmark."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ratelab"
path = "src/main.rs"

[dependencies]
ratelab = { workspace = true, features = ["std-clock"] }
sim = { path = "../sim" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
serde_json = "1.0"

[lints]
workspace = true
