[package]
name = "server"
description = "Web dashboard and demo binary for the rate limiter."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
drl-core.workspace = true
drl-redis-store.workspace = true
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prometheus = "0.13"
actix-web = "4.4"
actix-cors = "0.7"
actix-files = "0.6"
