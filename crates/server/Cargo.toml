[package]
name = "server"
description = "Axum server with a Tower rate limit layer, IETF RateLimit headers and a demo binary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
drl-core = { workspace = true, features = ["std-clock"] }
drl-redis-store.workspace = true
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
redis = { version = "1.8", default-features = false, features = ["tokio-comp"] }
testcontainers-modules = { version = "0.15", features = ["redis"] }

[lints]
workspace = true
