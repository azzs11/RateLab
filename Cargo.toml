[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/azzs11/distributed-rate-limiter"

[workspace.dependencies]
# Default features off here; crates that need the real clock enable "std-clock".
drl-core = { path = "crates/core", default-features = false }
drl-redis-store = { path = "crates/redis-store" }
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
