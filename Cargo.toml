[package]
name = "distributed-rate-limiter"
version = "0.6.0"
edition = "2021"
description = "Rate limiting algorithms in Rust (token bucket, leaky bucket, fixed and sliding window) with a Redis-backed prototype."
license = "MIT"
repository = "https://github.com/azzs11/distributed-rate-limiter"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
redis = { version = "0.24", features = ["tokio-comp", "script"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prometheus = "0.13"
lazy_static = "1.4"
actix-web = "4.4"
actix-cors = "0.7"
actix-files = "0.6"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false

[[bin]]
name = "web-server"
path = "src/server.rs"