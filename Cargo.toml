[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/azzs11/distributed-rate-limiter"

[workspace.dependencies]
drl-core = { path = "crates/core" }
drl-redis-store = { path = "crates/redis-store" }
anyhow = "1.0"
thiserror = "1.0"
