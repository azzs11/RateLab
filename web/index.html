<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ratelab · rate limiting, measured</title>
    <meta
      name="description"
      content="An interactive lab for rate limiting: watch token bucket, leaky bucket, fixed and sliding windows and GCRA decide in real time, simulate a cluster, and replay your own logs. Runs the real Rust library in your browser."
    />
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      // Apply a saved theme before first paint, so there is no flash.
      try {
        var t = localStorage.getItem("ratelab-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
